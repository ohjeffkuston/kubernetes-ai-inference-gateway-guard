[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubernetes-ai-inference-gateway-guard"
version = "1.0.0"
description = "Deterministic production-readiness policy for Kubernetes AI inference gateways"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
inference-gateway-guard = "inference_gateway_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
